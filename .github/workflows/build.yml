name: Build frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # no build-time secrets: the app only ever calls same-origin relative paths
      # (/api, /media) since frontend + backend share autoeditor.sarto.dev in prod,
      # so this build is fully static/reproducible - nothing to inject per-environment.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
